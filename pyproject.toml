[project]
name = "pycaret-time-series"
version = "0.1.0"
description = "Automated time series forecasting with PyCaret"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "matplotlib>=3.7.0,<3.8.0",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.0.0,<2.2",
    "pycaret>=3.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0,<1.6",
    "signalplot>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.yaml" = "config.yaml"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
